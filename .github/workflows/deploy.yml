name: Deploy a Apps Script

# Cuando corre este workflow
on:
  # En cada push a main o desarrollo (merge de PR o push directo)
  push:
    branches:
      - main
      - desarrollo
  # Permite disparar manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

jobs:
  # Verifica que los secrets necesarios esten configurados. En forks recien
  # clonados los secrets no existen y el push a Apps Script no puede correr;
  # en ese caso este job termina en verde y el deploy se omite en vez de
  # fallar en rojo. Ver README, seccion "Uso en tu propia cuenta".
  check-secrets:
    name: Verificar secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          HAS_CLASP_JSON: ${{ secrets.CLASP_JSON != '' }}
          HAS_CLASPRC_JSON: ${{ secrets.CLASPRC_JSON != '' }}
        run: |
          if [ "$HAS_CLASP_JSON" = "true" ] && [ "$HAS_CLASPRC_JSON" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets CLASP_JSON y/o CLASPRC_JSON no configurados. Deploy automatico omitido. Ver README, seccion Uso en tu propia cuenta."
          fi

  deploy:
    name: clasp push a GestorSolicitudes_AddOn
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      # 1) Bajar el codigo del repo al runner temporal
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Instalar Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3) Instalar dependencias del proyecto (ESLint, plugins)
      - name: Install dependencies
        run: npm ci

      # 4) Correr el linter como validacion previa. Si falla, aborta antes
      #    de subir cualquier cambio a Apps Script.
      - name: Run ESLint
        run: npm run lint

      # 5) Instalar clasp globalmente en el runner
      - name: Install clasp
        run: npm install -g @google/clasp

      # 6) Restaurar el token de autenticacion desde el Secret al home del
      #    runner. Sin esto clasp no esta logueado y Google rechaza el push.
      - name: Restore clasp auth
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      # 7) Restaurar el .clasp.json (con el scriptId del proyecto) desde
      #    el Secret. Sin esto clasp no sabe a que Apps Script subir.
      - name: Restore .clasp.json
        run: echo '${{ secrets.CLASP_JSON }}' > .clasp.json

      # 8) Leer el logo que el proyecto ya tiene en Apps Script. El manifest
      #    real esta en .gitignore, asi que el runner no lo tiene; se baja
      #    el del proyecto, se guarda aparte y se restaura el codigo del repo
      #    para no subir versiones viejas. Si la lectura falla, sigue con la
      #    plantilla.
      - name: Read current logo from Apps Script
        run: |
          clasp pull || echo "::warning::No se pudo leer el proyecto, se usara el logo de la plantilla."
          if [ -f src/appsscript.json ]; then cp src/appsscript.json "$RUNNER_TEMP/remote-manifest.json"; fi
          git checkout -- src
          git clean -fdq src
          rm -f src/appsscript.json

      # 9) Generar src/appsscript.json a partir de la plantilla, conservando
      #    el logo leido en el paso anterior. Sin logo propio, queda el de
      #    la plantilla.
      - name: Generate manifest from template
        run: node scripts/generar-manifest.js "$RUNNER_TEMP/remote-manifest.json"

      # 10) Ejecutar el push. --force acepta automaticamente cambios en el
      #    manifest (appsscript.json) sin pedir confirmacion interactiva.
      - name: Push to Apps Script
        run: clasp push --force
