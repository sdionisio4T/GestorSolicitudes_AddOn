name: Compartir proyecto con tester

# Solo se dispara a mano desde la pestana Actions. Da acceso de Editor sobre
# el proyecto de Apps Script al correo indicado, usando la cuenta de Google
# del secret CLASPRC_JSON. Solo agrega acceso, no lo revoca.
on:
  workflow_dispatch:
    inputs:
      correo:
        description: 'Correo de Google del tester'
        required: true

jobs:
  check-secrets:
    name: Verificar secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          HAS_CLASP_JSON: ${{ secrets.CLASP_JSON != '' }}
          HAS_CLASPRC_JSON: ${{ secrets.CLASPRC_JSON != '' }}
        run: |
          if [ "$HAS_CLASP_JSON" = "true" ] && [ "$HAS_CLASPRC_JSON" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets CLASP_JSON y/o CLASPRC_JSON no configurados. No se comparte nada. Ver README, seccion Uso en tu propia cuenta."
          fi

  compartir:
    name: Compartir con ${{ inputs.correo }}
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore clasp auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Restore .clasp.json
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: printf '%s' "$CLASP_JSON" > .clasp.json

      - name: Compartir proyecto
        env:
          TESTER_EMAIL: ${{ inputs.correo }}
        run: node scripts/compartir.js
